name: AMoDE engineering checks

on:
  push:
    branches: ["feature/**"]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-24.04
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12.8"
      - run: python -m pip install uv==0.13.9
      - run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0
      - working-directory: GUI/MainControllerPC/AMOAdmin
        run: |
          uv sync --locked
          uv run --locked ruff format --check .
          uv run --locked ruff check .
          uv run --locked python -m unittest discover -s tests
          uv build --wheel
      - name: Check benchmark drivers and physical source lines
        run: |
          app=GUI/MainControllerPC/AMOAdmin
          drivers=(tests/integration/fms_benchmark/{desktop_smoke,qt_driver,report_table,run,verify_mutations}.py)
          uv run --locked --project "$app" ruff format --check --config "$app/pyproject.toml" "${drivers[@]}"
          uv run --locked --project "$app" ruff check --config "$app/pyproject.toml" "${drivers[@]}"
          python tests/integration/check_source_lines.py
          python -m unittest discover -s tests/integration

  servers:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "21"
      - run: mvn -B -ntp -f Server/AMOMainServer/AmoMainControlService/pom.xml spotless:check verify
      - run: mvn -B -ntp -f Server/WebServer/AmoWebService/backend/pom.xml spotless:check verify

  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "21"
      - run: sdkmanager "platforms;android-36"
      - working-directory: GUI/UserMobile/AndroidApp
        run: ./gradlew --no-daemon :app:ktlintCheck :app:lintDebug :app:testDebugUnitTest :app:assembleDebug

  admin-web:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: Server/WebServer/AmoWebService/frontend/admin
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.22.0"
      - run: npm ci
      - run: npm run check && npm test && npm run build
