# arduino-cli build profile:
#   arduino-cli compile --profile esp32dev --warnings all .
# micro_ros_arduino is not in the Arduino library index. Unpack the
# v2.0.8-jazzy release ZIP into ../../third_party/micro_ros_arduino/
# (ignored by Git); README.md gives the download URL and SHA-256.
profiles:
  esp32dev:
    notes: ESP32 Dev Module. Keep core 2.0.17; core 3.x breaks micro-ROS timing.
    fqbn: esp32:esp32:esp32
    platforms:
      - platform: esp32:esp32 (2.0.17)
        platform_index_url: https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json
    libraries:
      - dir: ../../third_party/micro_ros_arduino
default_profile: esp32dev
