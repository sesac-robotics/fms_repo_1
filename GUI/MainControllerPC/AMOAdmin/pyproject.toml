[project]
name = "amo-fms"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = ["PyQt6==6.9.1"]

[project.scripts]
amo-admin = "amo_fms.admin_entry:main"
amo-fms = "amo_fms.main:main"

[dependency-groups]
dev = ["ruff==0.14.4"]

[build-system]
requires = ["hatchling==1.28.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/amo_fms"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.format]
quote-style = "single"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]
