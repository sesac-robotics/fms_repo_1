global
    maxconn 128
    ssl-default-bind-options ssl-min-ver TLSv1.2

defaults
    timeout connect 3s
    timeout client 15s
    timeout server 15s

frontend classroom_web
    mode http
    bind "${AMO_LAN_BIND}:${AMO_LAN_WEB_PORT}" ssl crt /run/secrets/amo-lan.pem
    tcp-request connection reject unless { src "${AMO_LAN_CIDR}" }
    http-request set-header Host localhost:5175
    http-response replace-header Set-Cookie ^(.*)$ "\\1; Secure"
    default_backend admin_web

backend admin_web
    mode http
    server admin "127.0.0.1:${AMO_ADMIN_WEB_PORT}"

frontend classroom_if03
    mode tcp
    bind "${AMO_LAN_BIND}:${AMO_LAN_IF03_PORT}" ssl crt /run/secrets/amo-lan.pem
    tcp-request connection reject unless { src "${AMO_LAN_CIDR}" }
    default_backend main_control_if03

backend main_control_if03
    mode tcp
    server main-control "127.0.0.1:${AMO_FMS_TCP_PORT}"
